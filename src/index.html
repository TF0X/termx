<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>termx</title>
<link rel="stylesheet" href="xterm.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  overflow: hidden;
  background: transparent;
  color: rgba(255, 255, 255, 0.86);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* Everything visible lives in #app so the wobble can warp it as one sheet.
   Its background is the one translucent tint over the window's acrylic. */
#app {
  position: absolute; inset: 0;
  background-color: rgba(var(--tint), var(--alpha));
  transform-origin: 0 0;
  transition: background-color .25s ease;
}
#app.lifted {
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 18px 40px -12px rgba(0, 0, 0, 0.6);
  will-change: transform;
}

#bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 38px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px 0 12px;
  background: rgba(255, 255, 255, 0.025);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.06);
}

/* ---- window controls ---- */
.winbar { display: flex; gap: 7px; flex: 0 0 auto; margin-right: 8px; }
.wbtn {
  width: 13px; height: 13px; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, 0.13);
  cursor: pointer; padding: 0;
  transition: background .16s ease, transform .16s ease;
}
.wbtn:hover { transform: scale(1.14); }
.wbtn.close:hover { background: #FF5F57; }
.wbtn.min:hover   { background: #FEBC2E; }
.wbtn.max:hover   { background: #28C840; }

/* ---- tabs ---- */
#tabs { display: flex; gap: 4px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
.tab {
  display: flex; align-items: center; gap: 7px;
  height: 26px; min-width: 0; max-width: 200px;
  padding: 0 5px 0 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  color: rgba(255, 255, 255, 0.5);
  font-size: 12px;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
.tab:hover { background: rgba(255, 255, 255, 0.07); color: rgba(255, 255, 255, 0.8); }
.tab.on {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.08);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .x {
  flex: 0 0 auto;
  width: 16px; height: 16px; border: 0; border-radius: 5px;
  background: transparent; color: inherit;
  font-size: 13px; line-height: 16px; cursor: pointer;
  opacity: 0; transition: opacity .14s ease, background .14s ease;
}
.tab:hover .x, .tab.on .x { opacity: .55; }
.tab .x:hover { opacity: 1; background: rgba(255, 255, 255, 0.12); }

/* Profile badge, shared by tabs and the dropdown. */
.badge {
  flex: 0 0 auto;
  width: 16px; height: 16px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font: 700 8.5px/1 "Cascadia Mono", Consolas, monospace;
  color: #fff;
  background: var(--c);
  box-shadow: 0 0 10px -3px var(--c);
}

.newbtn { display: flex; flex: 0 0 auto; border-radius: 8px; transition: background .18s ease; }
.newbtn:hover { background: rgba(255, 255, 255, 0.05); }
.ibtn {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  border: 0; border-radius: 8px;
  background: transparent;
  color: rgba(255, 255, 255, 0.45);
  font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s ease, color .18s ease;
}
.ibtn:hover { background: rgba(255, 255, 255, 0.09); color: rgba(255, 255, 255, 0.9); }
#more { width: 18px; font-size: 10px; }
#more.open { color: #fff; background: rgba(255, 255, 255, 0.1); }
#glass { font-size: 12px; }
#glass.lit { color: rgba(255, 255, 255, 0.85); }

.spacer { flex: 1 1 auto; align-self: stretch; }

/* ---- dropdown ---- */
#menu {
  position: absolute; top: 36px; z-index: 20;
  min-width: 250px;
  padding: 5px;
  border-radius: 10px;
  background: rgba(24, 26, 32, 0.92);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 16px 40px -10px rgba(0, 0, 0, 0.75);
  font-size: 12.5px;
  opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top left;
  pointer-events: none;
  transition: opacity .14s ease, transform .16s cubic-bezier(.32, .72, 0, 1);
}
#menu.open { opacity: 1; transform: none; pointer-events: auto; }
.mi {
  display: flex; align-items: center; gap: 10px;
  height: 30px; padding: 0 9px;
  border-radius: 7px;
  color: rgba(255, 255, 255, 0.82);
  cursor: pointer;
}
.mi:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.mi .label { flex: 1 1 auto; white-space: nowrap; }
.mi .key { color: rgba(255, 255, 255, 0.35); font-size: 11px; white-space: nowrap; }
.mi .ico { width: 16px; text-align: center; color: rgba(255, 255, 255, 0.5); font-size: 13px; }
.mi .check { width: 16px; text-align: center; color: #a8d4ff; }
.msep { height: 1px; margin: 5px 6px; background: rgba(255, 255, 255, 0.08); }
.mhint { padding: 3px 9px 4px; color: rgba(255, 255, 255, 0.3); font-size: 10.5px; }

/* ---- panes ---- */
#stage { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; }
.tabstage { position: absolute; inset: 0; display: none; }
.tabstage.on { display: flex; }
.split { display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
.split.row { flex-direction: row; }
.split.col { flex-direction: column; }
.slot { display: flex; min-width: 0; min-height: 0; }
.cell { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; }
.pane { position: absolute; inset: 7px 3px 5px 11px; }

/* Inactive panes recede a little once a tab is split. */
.multi .cell .xterm { transition: opacity .2s ease; }
.multi .cell:not(.focus) .xterm { opacity: .58; }

.divider { flex: 0 0 7px; position: relative; z-index: 2; }
.row > .divider { cursor: col-resize; }
.col > .divider { cursor: row-resize; }
.divider::after {
  content: ""; position: absolute;
  background: rgba(255, 255, 255, 0.08);
  transition: background .16s ease;
}
.row > .divider::after { top: 0; bottom: 0; left: 3px; width: 1px; }
.col > .divider::after { left: 0; right: 0; top: 3px; height: 1px; }
.divider:hover::after, .divider.drag::after { background: rgba(168, 212, 255, 0.5); }

.xterm .xterm-viewport { background-color: transparent !important; }
.xterm-viewport::-webkit-scrollbar { width: 8px; }
.xterm-viewport::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
.xterm-viewport::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
.xterm-viewport::-webkit-scrollbar-track { background: transparent; }

/* ---- resize grips (frameless windows get none for free) ---- */
.rz { position: absolute; z-index: 30; }
.rz.n  { top: 0; left: 0; right: 0; height: 4px; cursor: ns-resize; }
.rz.s  { bottom: 0; left: 0; right: 0; height: 4px; cursor: ns-resize; }
.rz.w  { left: 0; top: 0; bottom: 0; width: 4px; cursor: ew-resize; }
.rz.e  { right: 0; top: 0; bottom: 0; width: 4px; cursor: ew-resize; }
.rz.nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
.rz.ne { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
.rz.sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: nesw-resize; }
.rz.se { bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="winbar">
      <button class="wbtn close" title="Close"></button>
      <button class="wbtn min" title="Minimize"></button>
      <button class="wbtn max" title="Maximize"></button>
    </div>
    <div id="tabs"></div>
    <div class="newbtn">
      <button id="add" class="ibtn" title="New tab (Ctrl+Shift+T)">+</button>
      <button id="more" class="ibtn" title="Profiles and splits (Ctrl+Shift+Space)">&#x2304;</button>
    </div>
    <div id="drag" class="spacer" title="Drag to move"></div>
    <button id="glass" class="ibtn"></button>
  </div>
  <div id="stage"></div>
  <div id="menu"></div>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-webgl.js"></script>
<script src="term.js"></script>
</body>
</html>
