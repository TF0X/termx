[package]
name = "glassterm"
version = "0.1.0"
edition = "2024"
description = "A small glass terminal for Windows"

[dependencies]
arboard = { version = "3", default-features = false }
base64 = "0.22"
dirs = "7.0.0"
portable-pty = "0.9"
serde_json = "1.0.154"
tao = "0.37.2"
wry = "0.57.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
