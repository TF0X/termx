<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Simplified mark for 16-32px: no window dots, no split, a bolder prompt. -->
  <title>termx</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4fd8"/>
      <stop offset="0.55" stop-color="#2a2c78"/>
      <stop offset="1" stop-color="#5a2a9c"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ff0fb"/>
      <stop offset="1" stop-color="#b3b0ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="#ffffff" fill-opacity="0.08"/>
  <path d="M60 78 L120 128 L60 178" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="134" y="160" width="72" height="28" rx="14" fill="url(#cursor)"/>
</svg>
