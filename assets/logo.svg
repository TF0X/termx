<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>termx</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c2a"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="38" y="64" width="180" height="136" rx="22"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <!-- Heavier blur for what shows through the glass: that is the frost. -->
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8f5"/>
      <stop offset="1" stop-color="#8f8cff"/>
    </linearGradient>
    <g id="aurora">
      <circle cx="70" cy="70" r="58" fill="#6d6bff"/>
      <circle cx="196" cy="88" r="52" fill="#22c4e0"/>
      <circle cx="176" cy="206" r="62" fill="#b45cff"/>
      <circle cx="58" cy="196" r="40" fill="#2f7bff"/>
    </g>
  </defs>

  <!-- Tile with the aurora glowing inside it. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)" opacity="0.85">
    <use href="#aurora" filter="url(#soft)"/>
  </g>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Frosted card: blurred aurora, a dark wash, then a white sheen. -->
  <g clip-path="url(#cardClip)">
    <use href="#aurora" filter="url(#frost)"/>
    <rect x="38" y="64" width="180" height="136" fill="#10111c" fill-opacity="0.55"/>
    <rect x="38" y="64" width="180" height="136" fill="url(#sheen)"/>
    <!-- Split-pane divider. -->
    <rect x="160" y="64" width="2" height="136" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="166" y="104" width="38" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="166" y="120" width="26" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="166" y="136" width="32" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <rect x="38.75" y="64.75" width="178.5" height="134.5" rx="21.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Window dots. -->
  <circle cx="58" cy="82" r="4.5" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="72" cy="82" r="4.5" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="86" cy="82" r="4.5" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Prompt. -->
  <path d="M66 110 L98 134 L66 158" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="106" y="152" width="40" height="14" rx="7" fill="url(#cursor)"/>
</svg>
